name: test

on:
  push: # run this workflow on every push
  pull_request: # run this workflow on every pull_request

jobs:
  setup-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
      - name: Verify Gobra files (files mode)
        uses: ./
        with:
          files: 'test/files_test/file1.go test/files_test/file2.gobra'
          includePaths: 'test/include_path'
          timeout: 2m
      - name: Verify Gobra files with conditionalizePermissions (files mode)
        uses: ./
        with:
          files: 'test/files_test/file1.go test/files_test/file2.gobra'
          includePaths: 'test/include_path'
          timeout: 2m
          conditionalizePermissions: '1'
          # disableNL: '1'
      - name: Verify chopped Gobra files
        uses: ./
        with:
          files: 'test/files_test/file1.go@11 test/files_test/file2.gobra'
          includePaths: 'test/include_path'
          timeout: 2m
          overflow: 1
      - name: Verify Gobra files with the Z3 API
        uses: ./
        with:
          files: 'test/files_test/file1.go test/files_test/file2.gobra'
          includePaths: 'test/include_path'
          timeout: 2m
          # useZ3API: '1'
      - name: Verify Gobra files (package mode)
        uses: ./
        with:
          packages: 'test/packages_test/test1/'
          moreJoins: 'impure'
          enableFriendClauses: '1'
          timeout: 2m
      - name: Verify Gobra files (recursive mode)
        uses: ./
        with:
          projectLocation: 'gobra-action/test/'
          # the packages below `test/config_test` are verified via their JSON configs
          excludePackages: 'main timeout_test config_lib config_pkg1 config_pkg2'
          recursive: '1'
          timeout: 2m
          checkConsistency: '1'
      - name: Verify Gobra files (recursive and headerOnly mode)
        uses: ./
        with:
          projectLocation: 'gobra-action/test/'
          excludePackages: 'main'
          recursive: '1'
          headerOnly: '1'
          timeout: 2m
          statsFile: '/stats/'
      - name: Verify Gobra files without moreCompleteExhale and with parallelizeBranches
        uses: ./
        with:
          packages: 'test/packages_test/test1/'
          timeout: 2m
          mceMde: 'off'
          parallelizeBranches: 1
      - name: Verify Gobra files (config file mode, directory containing a gobra.json)
        uses: ./
        with:
          configFile: 'gobra-action/test/config_test/config_pkg1'
          timeout: 2m
      - name: Verify Gobra files (config file mode, path to a gobra.json)
        uses: ./
        with:
          configFile: 'gobra-action/test/config_test/config_pkg1/gobra.json'
          timeout: 2m
      - name: Print the configuration resolved from the JSON config files
        uses: ./
        with:
          configFile: 'gobra-action/test/config_test/config_pkg1'
          printConfig: '1'
          timeout: 2m
      - name: Test that the options of the JSON config are applied
        id: config-overflow
        continue-on-error: true
        uses: ./
        with:
          configFile: 'gobra-action/test/config_test/config_pkg2'
          timeout: 2m
      - name: Test that the options of the JSON config are applied (assertion)
        if: steps.config-overflow.outcome == 'success'
        run: |
          echo "Expected the verification of config_pkg2 to fail, since its gobra.json enables overflow checking"
          exit 1
      - name: Verify Gobra files (config file mode, with caching and statistics)
        uses: ./
        with:
          configFile: 'gobra-action/test/config_test/config_pkg1'
          caching: '1'
          statsFile: '/stats-config/'
          timeout: 2m
      - name: Test that the generated config file does not remain in the workspace
        run: |
          LEFTOVER=$(find test/config_test -name '.gobra-action-generated.json')
          if [ -n "$LEFTOVER" ]; then
            echo "The generated config file was left behind in the workspace: $LEFTOVER"
            exit 1
          fi
      - name: Test that defaults.awk agrees with action.yml
        run: |
          awk -f defaults.awk action.yml > /tmp/parsed.tsv
          python3 - <<'EOF'
          import yaml
          inputs = yaml.safe_load(open('action.yml'))['inputs']
          parsed = {}
          for line in open('/tmp/parsed.tsv'):
              line = line.rstrip('\n')
              if not line:
                  continue
              name, _, default = line.partition('\t')
              parsed[name] = default
          errors = []
          missing = set(inputs) ^ set(parsed)
          if missing:
              errors.append('inputs only found in one of the two: %s' % sorted(missing))
          for name, spec in inputs.items():
              expected = str((spec or {}).get('default', ''))
              if parsed.get(name) != expected:
                  errors.append('%s: defaults.awk gave %r, action.yml declares %r'
                                % (name, parsed.get(name), expected))
          if errors:
              raise SystemExit('\n'.join(errors))
          print('defaults.awk agrees with action.yml for %d inputs' % len(inputs))
          EOF
      - name: Test that configFile reports an error when combined with another input mode
        id: config-conflict
        continue-on-error: true
        uses: ./
        with:
          configFile: 'gobra-action/test/config_test/config_pkg1'
          files: 'test/files_test/file1.go'
          timeout: 2m
      - name: Test that configFile reports an error when combined with another input mode (assertion)
        if: steps.config-conflict.outcome == 'success'
        run: |
          echo "Expected the Action to reject 'configFile' in combination with 'files'"
          exit 1
      - name: Test that timeout reports an error
        continue-on-error: true
        uses: ./
        with:
          files: 'test/timeout_test/matching_loop.gobra'
          timeout: 10s
      - name: Upload statistics report
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: /stats/stats.json
          if-no-files-found: error # could also be 'warn' or 'ignore'
      # fails if the `statsFile` input had no effect in config file mode
      - name: Upload statistics report of the config file mode run
        uses: actions/upload-artifact@v4
        with:
          name: stats-config
          path: /stats-config/stats.json
          if-no-files-found: error
